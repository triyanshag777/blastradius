<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>BlastRadius</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.30.2/cytoscape.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/4.3.0/marked.min.js"></script>
<style>
  :root { --bg:#0d1117; --panel:#161b22; --line:#30363d; --text:#e6edf3; --muted:#8b949e; --accent:#ff7b54; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
  header { padding:14px 20px; border-bottom:1px solid var(--line); display:flex; align-items:baseline; gap:12px; }
  header h1 { margin:0; font-size:20px; }
  header h1 span { color:var(--accent); }
  header small { color:var(--muted); }
  .bar { padding:14px 20px; display:flex; gap:8px; flex-wrap:wrap; }
  .bar input { flex:1; min-width:260px; background:var(--panel); border:1px solid var(--line); color:var(--text); padding:10px 12px; border-radius:8px; font-size:14px; }
  button { background:var(--accent); color:#1a1a1a; border:0; padding:10px 16px; border-radius:8px; font-weight:600; cursor:pointer; }
  button.ghost { background:var(--panel); color:var(--text); border:1px solid var(--line); font-weight:400; }
  .main { display:grid; grid-template-columns: 1.6fr 1fr; gap:14px; padding:0 20px 20px; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:14px; }
  #cy { height:560px; }
  #answer { line-height:1.5; font-size:14px; max-height:420px; overflow:auto; }
  #answer table { border-collapse:collapse; margin:8px 0; font-size:13px; }
  #answer th, #answer td { border:1px solid var(--line); padding:4px 8px; text-align:left; }
  #answer code { background:#21262d; padding:1px 5px; border-radius:4px; font-size:12px; }
  #answer p { margin:6px 0; } #answer ul { padding-left:20px; margin:6px 0; }
  .chip { display:inline-block; background:#21262d; border:1px solid var(--line); padding:3px 8px; border-radius:999px; font-size:12px; margin:2px 4px 2px 0; color:var(--muted); }
  .legend span { display:inline-flex; align-items:center; gap:5px; margin-right:12px; font-size:12px; color:var(--muted); }
  .dot { width:10px; height:10px; border-radius:50%; display:inline-block; }
  h3 { margin:0 0 8px; font-size:13px; color:var(--muted); text-transform:uppercase; letter-spacing:.05em; }
  @media (max-width: 900px) { .main { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<header><h1>Blast<span>Radius</span></h1><small>Team Why Graph - what breaks if I change this code?</small></header>

<div class="bar">
  <input id="q" placeholder="Ask: What breaks if I change prepare_request?">
  <button id="go">Ask</button>
  <button class="ghost" data-q="What breaks if I change prepare_request in sessions? Which tests should I run and who should review?">Example 1</button>
  <button class="ghost" data-q="What breaks if I change the send function in Session? Which tests should I run?">Example 2</button>
</div>

<div class="main">
  <div class="card">
    <h3>Graph (neighbourhood of the changed function)</h3>
    <div class="legend">
      <span><i class="dot" style="background:#ff4d4d"></i>changed</span>
      <span><i class="dot" style="background:#ff9f43"></i>1 hop</span>
      <span><i class="dot" style="background:#ffd166"></i>2 hops</span>
      <span><i class="dot" style="background:#9aa5b1"></i>3 hops</span>
      <span><i class="dot" style="background:#4dabf7"></i>test</span>
      <span><i class="dot" style="background:#ffffff"></i>reasoning path</span>
    </div>
    <div id="cy"></div>
  </div>
  <div>
    <div class="card" style="margin-bottom:14px">
      <h3>Tools the agent chose</h3>
      <div id="tools"><span class="chip">nothing yet</span></div>
    </div>
    <div class="card">
      <h3>Answer</h3>
      <div id="answer">Ask a question to start.</div>
      <div style="margin-top:10px"><button id="prbtn" class="ghost" style="display:none">Generate PR comment</button></div>
    </div>
    <div class="card" id="prcard" style="display:none;margin-top:14px">
      <h3>PR comment (ready to paste)</h3>
      <textarea id="prtext" style="width:100%;height:260px;background:#0d1117;color:#e6edf3;border:1px solid var(--line);border-radius:8px;padding:8px;font-family:ui-monospace,monospace;font-size:12px"></textarea>
      <button id="copybtn" style="margin-top:8px">Copy</button>
    </div>
  </div>
</div>

<script>
const COLORS = { 0:'#ff4d4d', 1:'#ff9f43', 2:'#ffd166', 3:'#9aa5b1' };
let cy = null;

function render(g) {
  const els = [];
  g.nodes.forEach(n => els.push({ data: { id:n.id, label:n.label, hops:n.hops, kind:n.kind } }));
  g.edges.forEach((e, i) => els.push({ data: { id:'e'+i, source:e.source, target:e.target } }));
  if (cy) cy.destroy();
  cy = cytoscape({
    container: document.getElementById('cy'),
    elements: els,
    wheelSensitivity: 0.3,
    style: [
      { selector:'node', style:{
          'label':'data(label)', 'color':'#e6edf3', 'font-size':9, 'text-wrap':'ellipsis', 'text-max-width':'110px', 'text-valign':'bottom', 'text-margin-y':4,
          'background-color': n => n.data('kind')==='test' ? '#4dabf7' : (COLORS[n.data('hops')] || '#9aa5b1'),
          'width': n => n.data('hops')===0 ? 42 : (n.data('hops')===1 ? 28 : 20),
          'height': n => n.data('hops')===0 ? 42 : (n.data('hops')===1 ? 28 : 20),
          'shape': n => n.data('kind')==='test' ? 'diamond' : 'ellipse' } },
      { selector:'edge', style:{ 'width':1.4, 'line-color':'#3b4252', 'target-arrow-color':'#3b4252', 'target-arrow-shape':'triangle', 'curve-style':'bezier' } },
      { selector:'node.path', style:{ 'background-color':'#ffffff', 'border-width':3, 'border-color':'#ff7b54' } },
      { selector:'edge.path', style:{ 'line-color':'#ff7b54', 'target-arrow-color':'#ff7b54', 'width':4 } },
      { selector:'node[hops = 0]', style:{ 'background-color':'#ff4d4d', 'border-width':3, 'border-color':'#ffffff' } },
    ],
    layout: { name:'concentric', concentric: n => 10 - n.data('hops'), levelWidth: () => 1, minNodeSpacing: 28, padding: 20 },
  });
  animatePath(g.path);
}

function animatePath(path) {
  if (!path || path.length < 2) return;
  path.forEach((id, i) => {
    setTimeout(() => {
      cy.getElementById(id).addClass('path');
      if (i > 0) cy.edges().filter(e => e.data('source') === path[i-1] && e.data('target') === id).addClass('path');
    }, 500 * i);
  });
}

async function ask(question) {
  const btn = document.getElementById('go');
  btn.disabled = true; btn.textContent = 'Thinking...';
  document.getElementById('answer').textContent = 'The agent is choosing tools and querying the graph...';
  try {
    const res = await fetch('/api/ask', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ question }) });
    const data = await res.json();
    document.getElementById('answer').innerHTML = marked.parse(data.answer || '(no answer)');
    const t = document.getElementById('tools');
    t.innerHTML = '';
    data.calls.forEach(c => {
      const s = document.createElement('span');
      s.className = 'chip';
      s.textContent = c.tool + '(' + (c.args.name || c.args.text || c.args.source || '') .split('.').slice(-2).join('.') + ')';
      t.appendChild(s);
    });
    if (data.graph) { render(data.graph); window.lastTarget = data.graph.target; document.getElementById('prbtn').style.display = 'inline-block'; }
  } catch (e) {
    document.getElementById('answer').textContent = 'Error: ' + e;
  }
  btn.disabled = false; btn.textContent = 'Ask';
}

document.getElementById('prbtn').onclick = async () => {
  const res = await fetch('/api/pr_comment', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ target: window.lastTarget }) });
  const data = await res.json();
  document.getElementById('prtext').value = data.markdown;
  document.getElementById('prcard').style.display = 'block';
};
document.getElementById('copybtn').onclick = () => navigator.clipboard.writeText(document.getElementById('prtext').value);
document.getElementById('go').onclick = () => ask(document.getElementById('q').value);
document.getElementById('q').addEventListener('keydown', e => { if (e.key === 'Enter') ask(e.target.value); });
document.querySelectorAll('button[data-q]').forEach(b => b.onclick = () => { document.getElementById('q').value = b.dataset.q; ask(b.dataset.q); });
</script>
</body>
</html>
